<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — FitPulse</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/register.css" />
</head>

<body>

    <div class="register-wrapper">
        <header class="brand-section">
            <h1 class="brand-name">FitPulse</h1>
            <p class="brand-tagline">Your ultimate fitness companion.</p>
        </header>

        <main class="hero-card">
            <h2 class="page-title">Create Account</h2>
            <p class="page-subtitle">Join thousands of athletes today.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="e.g. Jordan Lee" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="jordan@example.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required />
                    <div id="passwordError" class="error-msg">Passwords do not match.</div>
                </div>

                <button type="submit" class="btn-primary">Register Now</button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <button id="googleRegisterBtn" class="btn-google" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon" />
                Continue with Google
            </button>

            <p id="registerError" class="error-msg"></p>

            <footer class="footer-links">
                Already have an account? <a href="login.html">Login</a>
            </footer>
        </main>
    </div>

    <!-- Custom JS -->
    <script type="module" src="js/register.js"></script>
</body>

</html>
