<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — FitPulse</title>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">FitPulse</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
            <a href="fitness.html" class="nav-item"><i class="bi bi-activity"></i><span>Workouts</span></a>
            <a href="nutrition.html" class="nav-item"><i class="bi bi-egg-fried"></i><span>Nutrition</span></a>
            <a href="notifications.html" class="nav-item"><i class="bi bi-bell-fill"></i><span>Alerts</span></a>
            <a href="profile.html" class="nav-item"><i class="bi bi-person"></i><span>Profile</span></a>
        </nav>
        <a href="profile.html" class="sidebar-user">
            <img src="https://i.pravatar.cc/40?img=12" alt="User" class="user-avatar" />
            <div class="user-info">
                <div style="font-size: 0.85rem; font-weight: 700;">Jordan Lee</div>
                <div style="font-size: 0.7rem; color: var(--lime);">PRO MEMBER</div>
            </div>
        </a>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="page-title">Personal <span>Dashboard</span></h1>
        </header>

        <main class="dashboard-content">
            <!-- Summary Stats -->
            <section class="stats-grid">
                <div class="summary-card">
                    <div class="card-title">Workout Sessions</div>
                    <div class="card-value" id="summaryWorkouts">--</div>
                    <span class="card-unit">sessions</span>
                </div>
                <div class="summary-card">
                    <div class="card-title">Total Duration</div>
                    <div class="card-value" id="summaryDuration">--</div>
                    <span class="card-unit">min</span>
                </div>
                <div class="summary-card">
                    <div class="card-title">Total Calories</div>
                    <div class="card-value" id="summaryCalories">--</div>
                    <span class="card-unit">k</span>
                </div>
                <div class="summary-card">
                    <div class="card-title">Average Time</div>
                    <div class="card-value" id="summaryAvg">--</div>
                    <span class="card-unit">min</span>
                </div>
            </section>

            <!-- Charts Section -->
            <section class="charts-grid">
                <div class="chart-card">
                    <div class="chart-header">
                        <label class="chart-title">Weekly Activity Duration</label>
                    </div>
                    <div class="chart-container">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-header">
                        <label class="chart-title">Steps Trend</label>
                    </div>
                    <div class="chart-container">
                        <canvas id="stepsChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Feeds Section -->
            <section class="feeds-grid">
                <!-- Recent Activity List -->
                <div class="feed-section">
                    <label class="section-label">Recent Activity <a href="fitness.html" class="view-all">View All</a></label>
                    <div id="logsFeed">
                        <!-- Loaded by JS -->
                    </div>
                </div>

                <!-- Recent Meals List -->
                <div class="feed-section">
                    <label class="section-label">Recent Meals <a href="nutrition.html" class="view-all">Plan</a></label>
                    <div id="mealsFeed">
                        <!-- Loaded by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="js/dashboard.js"></script>
</body>

</html>
