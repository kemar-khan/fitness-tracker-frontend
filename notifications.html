<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerts — FitPulse</title>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/notifications.css" />
</head>

<body>

    <!-- sidebar -->
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="page-title">Notifications <span>&</span> Reminders</h1>
            <button class="btn-primary" id="addReminderBtn" style="display: none;">
                <i class="bi bi-plus-lg"></i> New Reminder
            </button>
        </header>

        <div class="view-switcher">
            <button class="switch-btn active" data-view="notifications">
                Notifications <span id="notifCount">0</span>
            </button>
            <button class="switch-btn" data-view="reminders">Reminders</button>
        </div>

        <div class="content-container">
            <!-- Notifications View -->
            <section id="notificationsView" class="section-view active">
                <div id="notifFeed">
                    <!-- Loaded by JS -->
                </div>
                <div id="notifEmpty" class="empty-state" style="display: none;">
                    <i class="bi bi-bell-slash"></i>
                    <p>All caught up!</p>
                </div>
            </section>

            <!-- Reminders View -->
            <section id="remindersView" class="section-view">
                <div id="remindersList">
                    <!-- Loaded by JS -->
                </div>
                <div id="remindersEmpty" class="empty-state" style="display: none;">
                    <i class="bi bi-clock"></i>
                    <p>No active reminders</p>
                </div>
            </section>
        </div>
    </div>

    <!-- SIMPLE MODAL -->
    <div class="modal-overlay" id="reminderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Create Reminder</h2>
                <button class="btn-small" id="closeModal"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="reminderForm">
                <div class="form-group">
                    <label class="form-label">Reminder Title</label>
                    <input type="text" id="remTitle" class="form-input" placeholder="e.g. Afternoon Run" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="remCategory" class="form-input" required>
                        <option value="workout">Workout</option>
                        <option value="nutrition">Nutrition</option>
                        <option value="hydration">Hydration</option>
                        <option value="sleep">Sleep</option>
                    </select>


                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" id="remDate" class="form-input" required />
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label">Time</label>
                            <input type="time" id="remTime" class="form-input" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Frequency</label>
                            <select id="remFrequency" class="form-input" required>
                                <option value="One-Time">One-Time</option>
                                <option value="daily">Daily</option>
                                <option value="weekdays">Weekdays</option>
                                <option value="weekends">Weekends</option>
                            </select>
                        </div>
                    </div>
                    <input type="hidden" id="editingId" value="" />
                    <div class="modal-footer">
                        <button type="button" class="btn-primary"
                            style="background: var(--border); color: white; width: 100%;" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-primary" style="width: 100%;">Save</button>
                    </div>
            </form>
        </div>
    </div>

    <!-- TOAST (Implicit through JS) -->
    <!-- sidebar loader-->
    <script src="js/sidebar-loader.js"></script>
    <script type="module" src="js/notifications.js"></script>
</body>

</html>
