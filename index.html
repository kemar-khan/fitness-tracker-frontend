<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — FitPulse</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css" />
</head>

<body>

    <div class="login-wrapper">
        <header class="brand-section">
            <h1 class="brand-name">FitPulse</h1>
            <p class="brand-tagline">Achieve your best self.</p>
        </header>

        <main class="hero-card">
            <h2 class="page-title">Welcome Back</h2>
            <p class="page-subtitle">Login to your fitness account.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="jordan@example.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn-primary">Log In</button>
            </form>

            <footer class="footer-links">
                Don't have an account? <a href="register.html">Register Now</a>
            </footer>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="js/login.js"></script>
</body>

</html>
