<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — FitPulse</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css" />
    <style>
        /* Add a small style to make the Google button look premium */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #B4D400; /* Your Electric Lime */
            color: #000;
            font-weight: 700;
            border: none;
            padding: 15px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .google-btn:hover {
            transform: scale(1.02);
        }
        .google-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <header class="brand-section">
            <h1 class="brand-name">FitPulse</h1>
            <p class="brand-tagline">Achieve your best self.</p>
        </header>

        <main class="hero-card">
            <h2 class="page-title">Welcome Back</h2>
            <p class="page-subtitle">Access your fitness dashboard instantly.</p>

            <!-- REMOVED THE FORM AND ADDED THE GOOGLE BUTTON -->
            <div class="login-actions">
                <button id="googleLoginBtn" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                    Log in with Google
                </button>
            </div>

            <footer class="footer-links" style="margin-top: 2rem;">
                Don't have an account yet? <a href="register.html">Register here</a><br />
                Secure authentication powered by Firebase.
            </footer>
        </main>
    </div>

    <!-- Custom JS -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
