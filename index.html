<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — FitPulse</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css" />

    <style>
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #B4D400;
            color: #000;
            font-weight: 700;
            border: none;
            padding: 15px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .google-btn:hover {
            transform: scale(1.02);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .primary-btn {
            width: 100%;
            padding: 15px;
            font-weight: 700;
            border: none;
            background: #000;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            font-weight: 600;
        }

        #loginError {
            color: #ff4444;
            display: none;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-wrapper">
    <header class="brand-section">
        <h1 class="brand-name">FitPulse</h1>
        <p class="brand-tagline">Achieve your best self.</p>
    </header>

    <main class="hero-card">
        <h2 class="page-title">Welcome Back</h2>
        <p class="page-subtitle">Access your fitness dashboard instantly.</p>

        <!-- EMAIL LOGIN -->
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required />
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required />
            </div>

            <button type="submit" class="primary-btn">Login</button>

            <p id="loginError"></p>
        </form>

        <div class="divider">OR</div>

        <!-- GOOGLE LOGIN -->
        <button id="googleLoginBtn" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon">
            Log in with Google
        </button>

        <footer class="footer-links" style="margin-top: 2rem;">
            Don't have an account yet? <a href="register.html">Register here</a><br />
            Secure authentication powered by Firebase.
        </footer>
    </main>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
