<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker | Activity Logs</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (optional but nice) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-strava sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Fitness Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="fitness.html">Fitness Logs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nutrition.html">Nutrition</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="nav-user-profile me-3 d-none d-lg-flex">
                        <span id="navUserName" class="text-white fw-bold me-2">Jane Doe</span>
                        <div class="nav-avatar">
                            <i class="bi bi-person-circle"></i>
                        </div>
                    </div>
                    <a href="index.html" class="nav-link text-white fw-bold">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h2>Fitness Tracker</h2>
                <p>Log workouts, steps, and activities.</p>
            </div>
            <button class="btn btn-strava w-auto px-4" data-bs-toggle="modal" data-bs-target="#addLogModal">
                <i class="bi bi-plus-lg me-2"></i>Add New Log
            </button>
        </div>

        <!-- Quick Filters Row -->
        <div class="filter-row">
            <form class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label mb-1">Date From</label>
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label mb-1">Date To</label>
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label mb-1">Activity Type</label>
                    <select class="form-select form-control">
                        <option selected>All</option>
                        <option>Workout</option>
                        <option>Steps</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label mb-1">Search</label>
                    <input type="text" class="form-control" placeholder="Search activity...">
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-strava p-2">Filter</button>
                </div>
            </form>
        </div>

        <!-- Mini Summary Row -->
        <div class="row g-4 mini-summary-row">
            <div class="col-md-4">
                <div class="mini-badge">
                    <div class="icon-box"><i class="bi bi-calendar-check"></i></div>
                    <div class="badge-content">
                        <span class="badge-label">Total Logs (Week)</span>
                        <span class="badge-value">5 Logs</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="mini-badge">
                    <div class="icon-box"><i class="bi bi-clock-history"></i></div>
                    <div class="badge-content">
                        <span class="badge-label">Total Duration</span>
                        <span class="badge-value">245 min</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="mini-badge">
                    <div class="icon-box"><i class="bi bi-footprints"></i></div>
                    <div class="badge-content">
                        <span class="badge-label">Total Steps</span>
                        <span class="badge-value">42,800 Steps</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="activity-table-card">
            <div class="table-responsive">
                <table class="table strava-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Activity</th>
                            <th>Type</th>
                            <th>Duration (min)</th>
                            <th>Steps</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <!-- Logs will be rendered here via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Log Modal -->
    <div class="modal fade" id="addLogModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Activity Log</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addLogForm">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="activityName" class="form-label">Activity Name</label>
                                <input type="text" class="form-control" id="activityName" placeholder="e.g. Morning Run"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label for="activityType" class="form-label">Category/Type</label>
                                <select class="form-select form-control" id="activityType" required>
                                    <option value="Workout">Workout</option>
                                    <option value="Steps">Steps</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="duration" class="form-label">Duration (min)</label>
                                <input type="number" class="form-control" id="duration" placeholder="e.g. 45" required>
                            </div>
                            <div id="stepsField" class="col-12" style="display: none;">
                                <label for="steps" class="form-label">Steps (optional)</label>
                                <input type="number" class="form-control" id="steps" placeholder="e.g. 8000">
                            </div>
                            <div class="col-md-6">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <div class="col-md-6">
                                <label for="time" class="form-label">Time</label>
                                <input type="time" class="form-control" id="time" required>
                            </div>
                            <div class="col-12">
                                <label for="notes" class="form-label">Notes (optional)</label>
                                <textarea class="form-control" id="notes" rows="3"
                                    placeholder="How did it feel?"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="reset" class="btn btn-outline-secondary px-4">Reset</button>
                        <button type="submit" class="btn btn-strava w-auto px-4">Save Activity</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <script src="js/fitness.js"></script>
</body>

</html>
