<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity — FitPulse</title>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/fitness.css" />
</head>

<body>

    <!-- sidebar -->
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <header class="topbar">
            <h1 class="page-title">Activity <span>Logs</span></h1>
            <button class="btn-primary" id="openAddLogModal">
                <i class="bi bi-plus-lg"></i> Log Workout
            </button>
        </header>

        <main class="fitness-content">
            
            <section class="summary-grid">
                <div class="summary-card">
                    <span class="card-label">Total Logs</span>
                    <span class="card-value" id="statTotalLogs">--</span>
                </div>
                <div class="summary-card">
                    <span class="card-label">Total Duration</span>
                    <span class="card-value" id="statTotalDuration">-- <small style="font-size: 1rem">min</small></span>
                </div>
                <div class="summary-card">
                    <span class="card-label">Total Steps</span>
                    <span class="card-value" id="statTotalSteps">--</span>
                </div>
            </section>

            
            <section class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Date From</label>
                    <input type="date" class="filter-input" id="filterFrom" />
                </div>
                <div class="filter-group">
                    <label class="filter-label">Date To</label>
                    <input type="date" class="filter-input" id="filterTo" />
                </div>
                <div class="filter-group">
                    <label class="filter-label">Type</label>
                    <select class="filter-input" id="filterType">
                        <option value="All">All Activities</option>
                        <option value="Workout">Workout</option>
                        <option value="Steps">Steps</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button class="btn-primary" style="padding: 10px 20px; border-radius: 8px;" id="applyFilters">
                    <i class="bi bi-filter"></i>
                </button>
            </section>

        
            <section class="activity-feed" id="activityFeed">
            </section>

        </main>
    </div>


    <div class="modal-overlay" id="addLogModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Log Activity</h2>
                <button class="btn-small" id="closeModal"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="addLogForm">
                <div class="form-group">
                    <label class="form-label">Activity Name</label>
                    <input type="text" id="activityName" class="form-input" placeholder="e.g. Afternoon Run" required />
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="activityType" class="form-input" required>
                            <option value="Workout">Workout</option>
                            <option value="Steps">Steps</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Duration (min)</label>
                        <input type="number" id="duration" class="form-input" required />
                    </div>
                </div>
                <div class="form-group" id="stepsField" style="display: none;">
                    <label class="form-label">Steps Count</label>
                    <input type="number" id="steps" class="form-input" placeholder="8000" />
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" id="date" class="form-input" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Time</label>
                        <input type="time" id="time" class="form-input" required />
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea id="notes" class="form-input" style="height: 80px; resize: none;" placeholder="How did it feel?"></textarea>
                </div>
                <input type="hidden" id="editingId" value="" />
                <div class="modal-footer">
                    <button type="button" class="btn-primary" style="background: var(--border); color: white; width: 100%;" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save Log</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <!-- sidebar loader -->
    <script src="js/sidebar-loader.js"></script>
    <script type="module" src="js/fitness-ui.js"></script>
</body>

</html>
